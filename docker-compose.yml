version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: doboku-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dobokutracker
      POSTGRES_USER: doboku_user
      POSTGRES_PASSWORD: doboku_secure_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doboku_user -d dobokutracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doboku-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: development
      DATABASE_URL: postgresql://doboku_user:doboku_secure_dev_password@postgres:5432/dobokutracker
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /app/uploads/photos
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: doboku-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
  uploads_data:
